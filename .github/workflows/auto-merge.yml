name: Auto-merge

on:
  workflow_run:
    workflows:
      - Image
    types:
      - completed

permissions: {}

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          numbers=$(jq -r '.workflow_run.pull_requests // [] | .[].number' "$GITHUB_EVENT_PATH")
          for number in $numbers; do
            pr=$(gh api "repos/${REPOSITORY}/pulls/${number}")
            login=$(jq -r .user.login <<<"$pr")
            head=$(jq -r .head.sha <<<"$pr")
            repo=$(jq -r .head.repo.full_name <<<"$pr")
            merged=$(jq -r .merged <<<"$pr")
            draft=$(jq -r .draft <<<"$pr")
            [ "$login" = "dependabot[bot]" ] || continue
            [ "$repo" = "$REPOSITORY" ] || continue
            [ "$head" = "$HEAD_SHA" ] || continue
            [ "$merged" = "false" ] || continue
            [ "$draft" = "false" ] || continue
            gh pr merge "$number" --squash --repo "$REPOSITORY"
            gh workflow run image.yml --ref main --repo "$REPOSITORY"
          done
