name: update

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: oven-sh/setup-bun@v2

      - name: Update flake.lock
        id: update
        run: |
          nix flake update
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.update.outputs.changed == 'true'
        run: |
          nix build .#image
          ./result | docker load
          version=$(nix eval --raw .#image.heliumVersion)
          docker tag "helium-cdp:$version" helium-cdp

      - name: Start Helium
        if: steps.update.outputs.changed == 'true'
        run: docker run -d --name helium-cdp -p 9222:9222 --shm-size=1g helium-cdp

      - name: Exercise CDP with Bun.WebView
        if: steps.update.outputs.changed == 'true'
        run: bun test/cdp.ts

      - name: Check uBlock blocks a known ad script
        if: steps.update.outputs.changed == 'true'
        run: bun test/ublock.ts

      - name: Push lock
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: 更新 flake.lock"
          git push
