name: Update

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions: {}

jobs:
  lock:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Lock update
        id: update
        run: |
          nix flake update
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lock upload
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: flake-lock
          path: flake.lock

  image:
    name: ${{ matrix.arch }}
    needs: lock
    if: needs.lock.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: flake-lock
          path: ${{ runner.temp }}/lock

      - name: Lock apply
        run: cp "${{ runner.temp }}/lock/flake.lock" flake.lock

      - id: build
        uses: ./.github/actions/image
        with:
          arch: ${{ matrix.arch }}
          publish: "true"

  manifest:
    needs:
      - lock
      - image
    if: needs.lock.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Manifest
        env:
          VERSION: ${{ needs.image.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "${image}:${VERSION}" \
            --tag "${image}:latest" \
            "${image}:${VERSION}-amd64" \
            "${image}:${VERSION}-arm64"

  push:
    needs:
      - lock
      - manifest
    if: needs.lock.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: flake-lock
          path: ${{ runner.temp }}/lock

      - name: Lock push
        run: |
          cp "${{ runner.temp }}/lock/flake.lock" flake.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore: 更新 flake.lock"
          git push
