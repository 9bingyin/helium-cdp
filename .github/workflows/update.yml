name: update

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - uses: oven-sh/setup-bun@v2

      - name: Update flake.lock
        id: update
        run: |
          nix flake update
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.update.outputs.changed == 'true'
        run: |
          nix build .#image
          ./result | docker load
          version=$(nix eval --raw .#image.heliumVersion)
          docker tag "helium-cdp:$version" helium-cdp:latest

      - name: Start Helium
        if: steps.update.outputs.changed == 'true'
        run: docker run -d --name helium-cdp -p 9222:9222 --shm-size=1g helium-cdp

      - name: Exercise CDP with Bun.WebView
        if: steps.update.outputs.changed == 'true'
        run: bun test/cdp.ts

      - name: Check uBlock blocks a known ad script
        if: steps.update.outputs.changed == 'true'
        run: bun test/ublock.ts

      - name: Collect logs on failure
        if: failure() && steps.update.outputs.changed == 'true'
        run: docker logs helium-cdp || true

      - name: Upload lock
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock

  push:
    needs: lock
    if: needs.lock.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: flake-lock
          path: ${{ runner.temp }}/lock

      - name: Push lock
        run: |
          cp "${{ runner.temp }}/lock/flake.lock" flake.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore: 更新 flake.lock"
          git push
