name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cdp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Build image
        run: docker build -t helium-cdp .

      - name: Start Helium
        run: docker run -d --name helium-cdp -p 9222:9222 --shm-size=1g helium-cdp

      - name: Exercise CDP with Bun.WebView
        run: bun test/cdp.ts

      - name: Check uBlock blocks a known ad script
        run: bun test/ublock.ts

      - name: Collect logs on failure
        if: failure()
        run: docker logs helium-cdp

  publish:
    if: github.event_name != 'pull_request'
    needs: cdp
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read image version
        id: image
        shell: bash
        run: |
          version=$(awk -F= '/^ARG HELIUM_VERSION=/{print $2; exit}' Dockerfile)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo 'Invalid HELIUM_VERSION in Dockerfile' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: HELIUM_VERSION=${{ steps.image.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
