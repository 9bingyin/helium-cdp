name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cdp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: oven-sh/setup-bun@v2

      - name: Build image
        run: |
          nix build .#image
          ./result | docker load
          version=$(nix eval --raw .#image.heliumVersion)
          docker tag "helium-cdp:$version" helium-cdp:latest

      - name: Start Helium
        run: docker run -d --name helium-cdp -p 9222:9222 --shm-size=1g helium-cdp

      - name: Exercise CDP with Bun.WebView
        run: bun test/cdp.ts

      - name: Check uBlock blocks a known ad script
        run: bun test/ublock.ts

      - name: Collect logs on failure
        if: failure()
        run: docker logs helium-cdp || true

  publish:
    if: github.event_name != 'pull_request'
    needs: cdp
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Read image version
        id: image
        shell: bash
        run: |
          version=$(nix eval --raw .#image.heliumVersion)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "Invalid helium version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          nix build .#image
          ./result | docker load
          docker tag "helium-cdp:${{ steps.image.outputs.version }}" "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}"
          docker tag "helium-cdp:${{ steps.image.outputs.version }}" "${{ steps.image.outputs.name }}:latest"
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}"
          docker push "${{ steps.image.outputs.name }}:latest"
