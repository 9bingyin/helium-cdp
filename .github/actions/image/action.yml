name: Image
description: Build and test the container image, then publish an architecture tag when requested

inputs:
  publish:
    description: Push the tested image to GHCR
    required: false
    default: "false"
  arch:
    description: Architecture tag suffix, amd64 or arm64
    required: false
    default: ""

outputs:
  version:
    description: Helium version used as the image tag
    value: ${{ steps.build.outputs.version }}

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31

    - uses: oven-sh/setup-bun@v2

    - name: Build
      id: build
      shell: bash
      run: |
        nix build .#image
        ./result | docker load
        version=$(nix eval --raw .#image.heliumVersion)
        [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "Invalid helium version: $version" >&2; exit 1; }
        docker tag "helium-cdp:$version" helium-cdp
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Test
      shell: bash
      run: |
        docker run -d --name helium-cdp -p 9222:9222 --shm-size=1g helium-cdp
        bun test/cdp.ts
        bun test/ublock.ts

    - name: Logs
      if: failure()
      shell: bash
      run: docker logs helium-cdp || true

    - name: Publish
      if: inputs.publish == 'true'
      shell: bash
      env:
        VERSION: ${{ steps.build.outputs.version }}
        ARCH: ${{ inputs.arch }}
        GH_TOKEN: ${{ github.token }}
      run: |
        [ -n "$ARCH" ] || { echo "arch is required when publishing" >&2; exit 1; }
        echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        image="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}-${ARCH}"
        docker tag helium-cdp "$image"
        docker push "$image"
